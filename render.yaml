# Render Blueprint for the backend API (the frontend is deployed on Vercel).
# Render → New → Blueprint → pick this repository. Values marked "sync: false" are asked for once in the dashboard.
# Every push to main redeploys automatically.
services:
  - type: web
    name: resumind-api
    runtime: node
    plan: free
    rootDir: backend
    # Production dependencies only (skips the test tools and their MongoDB download)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Render puts one proxy in front of the app: needed for correct per-visitor rate limits
      - key: TRUST_PROXY
        value: "1"
      # Atlas connection string. Tip: use another database name than your local one (e.g. /resumind-live)
      - key: MONGO_URI
        sync: false
      # A long random secret, generated by Render
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Your Vercel URL, e.g. https://resumind.vercel.app (no trailing slash)
      - key: CLIENT_URL
        sync: false
